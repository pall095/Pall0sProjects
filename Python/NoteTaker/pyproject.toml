[project]
name = "notetaker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "path>=17.1.1",
    "pydantic>=2.14.1",
    "pyside6>=6.12.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/DatabaseManager" ]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
