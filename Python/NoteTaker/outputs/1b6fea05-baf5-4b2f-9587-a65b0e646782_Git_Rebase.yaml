title: Git Rebase
content: |-
  1) Switcho sulla branch da rebaseare.
  2) git fetch origin
  3) git pull
  4) git rebase origin/main
  Se tutto ok. Snnò devi risolvere i conflitti, cioè andare sui file che hanno conflitti ed accettare gli incoming o no.
  Non ricordo mai che nome da a cosa.
  Quando li accetti poi devi committare e poi puoi continuare rebase.
  5) git push --force-with-lease
